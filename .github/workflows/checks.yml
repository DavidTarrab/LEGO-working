name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/Analyze-ConcurrentRun.test.mjs tools/Select-LegoMeasurement.test.mjs tools/Prepare-LegoIntegration.test.mjs
      - run: node tools/Check-Publish.mjs
