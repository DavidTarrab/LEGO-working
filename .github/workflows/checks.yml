name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tools/*.test.mjs
      - run: python -m unittest discover -s tools -p test_gpu_trace.py
      - run: node tools/Check-Publish.mjs
